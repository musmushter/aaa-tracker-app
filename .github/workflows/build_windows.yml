name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_windows.yml'

jobs:
  build-windows:
    name: Build Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            throw "Expected release directory not found: $releaseDir"
          }
          New-Item -ItemType Directory -Force -Path "build\windows\package" | Out-Null
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "build\windows\package\aaa_tracker_windows_x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aaa-tracker-windows-x64
          path: build/windows/package/aaa_tracker_windows_x64.zip
          retention-days: 14
